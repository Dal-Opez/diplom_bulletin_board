<!DOCTYPE html>
<html>
<body>
    <p>Здравствуйте!</p>
    <p>Для сброса пароля используйте следующий API-запрос:</p>

    <pre>
POST /users/reset_password/confirm/
Content-Type: application/json

{
    "token": "{{ token }}",
    "password": "ваш_новый_пароль"
}
    </pre>

    <p>Или перейдите по ссылке для получения инструкций:</p>
    <a href="http://localhost:8000/users/reset_password/confirm/?token={{ token }}">
        Инструкции по сбросу пароля
    </a>
</body>
</html>
